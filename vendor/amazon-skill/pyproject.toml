[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "amazon-skill"
version = "0.1.0"
description = "Standalone Amazon research primitives for AI agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "httpx[http2]>=0.27,<1",
  "python-dotenv>=1.0,<2",
]

[project.scripts]
amazon-skill = "amazon_skill.cli:main"

[tool.setuptools.packages.find]
include = ["amazon_skill*"]
